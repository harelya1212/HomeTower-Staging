<!doctype html>
<html><head><meta charset="utf-8"><title>OCR diag 3</title></head>
<body>
<div id="status">starting</div>
<pre id="out1" style="white-space:pre-wrap;font-size:11px"></pre>
<hr>
<pre id="out2" style="white-space:pre-wrap;font-size:11px"></pre>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script>
const status = (m) => { document.getElementById('status').textContent = m; };
(async () => {
  const t0 = Date.now();
  try {
    const worker = await Tesseract.createWorker('eng', 1, {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/worker.min.js',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/tesseract-core-simd.wasm.js',
      langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0',
      logger: (m) => status(m.status + ' ' + Math.round((m.progress || 0) * 100) + '%'),
    });
    const r1 = await worker.recognize('diag-shot3.jpg');
    document.getElementById('out1').textContent = r1.data.text;
    status('first done, recognizing second');
    const r2 = await worker.recognize('diag-shot4.jpg');
    document.getElementById('out2').textContent = r2.data.text;
    await worker.terminate();
    status('DONE in ' + Math.round((Date.now() - t0) / 1000) + 's');
  } catch (e) {
    status('FAILED: ' + (e && e.message ? e.message : String(e)));
  }
})();
</script>
</body></html>
