<!doctype html>
<html><head><meta charset="utf-8"><title>CORS diag</title></head>
<body>
<div id="status">starting</div>
<script>
(async () => {
  const el = document.getElementById('status');
  try {
    const r = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/INTC?range=1d&interval=1d');
    const j = await r.json();
    const m = j.chart.result[0].meta;
    el.textContent = 'OK price=' + m.regularMarketPrice + ' pct=' + m.regularMarketChangePercent;
  } catch (e) {
    el.textContent = 'FAILED: ' + (e && e.message ? e.message : String(e));
  }
})();
</script>
</body></html>
